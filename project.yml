name: ZCodeMobile
options:
  bundleIdPrefix: ai.zcode
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "3.16.3"
    CURRENT_PROJECT_VERSION: "31610"
    GENERATE_INFOPLIST_FILE: NO
targets:
  ZCode:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: ZCode
        PRODUCT_BUNDLE_IDENTIFIER: ai.zcode.mobile
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  ZCodeMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/ZCodeMobileTests
    dependencies:
      - target: ZCode
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.zcode.mobile.tests
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
  ZCodeMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests/ZCodeMobileUITests
    dependencies:
      - target: ZCode
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.zcode.mobile.uitests
        TEST_TARGET_NAME: ZCode
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
schemes:
  ZCode:
    build:
      targets:
        ZCode: all
        ZCodeMobileTests: [test]
        ZCodeMobileUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ZCodeMobileTests
        - ZCodeMobileUITests
    archive:
      config: Release
